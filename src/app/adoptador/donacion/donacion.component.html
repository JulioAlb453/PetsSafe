<div class="content-donacion">
  <h2 class="donacion-title">Realizar una Donación</h2>
<form [formGroup]="donacionForm" (ngSubmit)="enviarDonacion()" class="donacion-form">
  <div class="form-group">
    <label for="idMascota" class="form-label">Seleccione la Mascota:</label>
    <select id="idMascota" formControlName="idMascota" class="form-select" required>
      <option value="" disabled selected>-- Selecciona una mascota --</option>
      <option *ngFor="let mascota of mascotas" [value]="mascota.id">{{ mascota.nombre }}</option>
    </select>
  </div>

  <div class="form-group">
    <label for="monto" class="form-label">Monto de Donación:</label>
    <input type="number" id="monto" formControlName="monto" required class="form-input" />
  </div>

  <div class="form-group">
    <label for="mensaje" class="form-label">Mensaje:</label>
    <textarea id="mensaje" formControlName="mensaje" class="form-textarea"></textarea>
  </div>

  <button type="submit" class="donar-button">Donar</button>
</form>

</div>
