<!-- donacion.component.html -->
<h2>Realizar una Donación</h2>
<form [formGroup]="donacionForm" (ngSubmit)="enviarDonacion()">
  <label for="idMascota">Seleccione la Mascota:</label>
  <select id="idMascota" formControlName="idMascota">
    <option *ngFor="let mascota of mascotas" [value]="mascota.id">{{ mascota.nombre }}</option>
  </select>

  <label for="monto">Monto de Donación:</label>
  <input type="number" id="monto" formControlName="monto" required>

  <label for="mensaje">Mensaje:</label>
  <textarea id="mensaje" formControlName="mensaje"></textarea>

  <button type="submit">Donar</button>
</form>
